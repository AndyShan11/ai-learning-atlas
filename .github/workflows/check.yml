name: Content checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/content.test.mjs
      - run: node scripts/docs.mjs
      - run: git diff --exit-code KNOWLEDGE.md
